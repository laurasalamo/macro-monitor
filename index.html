<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macro Monitor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <h1>Macro Monitor</h1>
  <div id="generated-at" class="generated-at">Loading&hellip;</div>
  <nav id="nav" class="nav"></nav>
</header>

<main>
  <div id="sections"></div>
</main>

<dialog id="ind-modal" class="ind-modal" aria-labelledby="ind-modal-title">
  <div class="ind-modal-inner">
    <div class="ind-modal-head">
      <div>
        <h2 id="ind-modal-title"></h2>
        <div id="ind-modal-rule" class="ind-modal-sub"></div>
      </div>
      <button type="button" class="ind-modal-close" aria-label="Close">&#x2715;</button>
    </div>
    <div class="ind-modal-controls">
      <div class="range-btns" role="group" aria-label="Time range">
        <button type="button" data-range="1Y">1Y</button>
        <button type="button" data-range="5Y">5Y</button>
        <button type="button" data-range="10Y">10Y</button>
        <button type="button" data-range="Max">Max</button>
      </div>
      <div class="date-range">
        <label for="ind-from">From</label><input type="date" id="ind-from">
        <label for="ind-to">to</label><input type="date" id="ind-to">
      </div>
      <a id="ind-fred-link" class="fred-link" target="_blank" rel="noopener"></a>
    </div>
    <div class="ind-modal-chart"><canvas id="ind-chart"></canvas></div>
    <div id="ind-modal-note" class="ind-modal-note"></div>
  </div>
</dialog>

<footer class="site-footer">
  <p>Personal project. Data via <a href="https://fred.stlouisfed.org" target="_blank" rel="noopener">FRED</a> (Federal Reserve Bank of St. Louis) and <a href="https://finance.yahoo.com" target="_blank" rel="noopener">Yahoo Finance</a>. Refreshed daily.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
